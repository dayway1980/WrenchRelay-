name: Android Shell

on:
  push:
    branches: [main]
    paths:
      - 'android-shell/**'
      - '.github/workflows/android-shell.yml'
  pull_request:
    paths:
      - 'android-shell/**'
      - '.github/workflows/android-shell.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-shell-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android-shell
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: '8.11.1'
      - name: Verify Gradle and Java are installed
        shell: bash
        run: |
          set -euo pipefail
          command -v java
          command -v gradle
          gradle --version
      - name: Validate Play signing input and identity guardrails (no signing)
        shell: bash
        run: |
          set -euo pipefail
          python3 verify_play_release.py --self-test
          python3 -m unittest discover -s . -p 'test_play_signing.py' -v
      - name: Check English/Spanish native resources
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s . -p 'test_locales.py' -v
      - name: Lint release
        run: gradle --no-daemon :app:lintRelease
      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Build unsigned release bundle
        run: gradle --no-daemon :app:bundleRelease
      - name: Checksum unsigned build outputs
        shell: bash
        run: |
          set -euo pipefail
          sha256sum app/build/outputs/apk/debug/*.apk app/build/outputs/bundle/release/*.aab > SHA256SUMS.txt
      - name: Verify Gradle Play identity overrides in merged manifest
        shell: bash
        run: |
          set -euo pipefail
          # 12345 is a CI-only fixture, not an approved or unused Play version.
          # This task changes only manifest intermediates after the default AAB is built.
          gradle --no-daemon -PplayApplicationId=com.wrenchrelayllc.industrial \
            -PplayVersionCode=12345 :app:processReleaseMainManifest
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import xml.etree.ElementTree as ET

          manifests = list(Path("app/build/intermediates/merged_manifest/release").glob("**/AndroidManifest.xml"))
          assert len(manifests) == 1, f"Expected one release merged manifest, got {manifests}"
          root = ET.parse(manifests[0]).getroot()
          android = "{http://schemas.android.com/apk/res/android}"
          assert root.get("package") == "com.wrenchrelayllc.industrial", root.attrib
          assert root.get(android + "versionCode") == "12345", root.attrib
          assert any(a.get(android + "name") == "com.wrenchrelay.industrial.MainActivity"
                     for a in root.findall("./application/activity")), "Launcher class must keep the existing namespace"
          print("LLC package and CI version override verified in Gradle merged manifest.")

          for flag, message in (
              ("-PplayApplicationId=com.example.invalid", "playApplicationId must match"),
              ("-PplayVersionCode=0", "playVersionCode must be an integer"),
              ("-PplayVersionCode=2100000001", "playVersionCode must be an integer"),
          ):
              result = subprocess.run(["gradle", "--no-daemon", flag, ":app:help"],
                                      text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              assert result.returncode != 0 and message in result.stdout, result.stdout
              print(f"Rejected invalid Play identity input: {flag}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wrenchrelay-industrial-android-build
          path: |
            android-shell/app/build/outputs/apk/debug/*.apk
            android-shell/app/build/outputs/bundle/release/*.aab
            android-shell/app/build/reports/lint-results-release.html
            android-shell/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
