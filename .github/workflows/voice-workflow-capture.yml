name: Voice workflow capture checks

on:
  push:
    branches:
      - feature/voice-workflow-capture-20261123
  pull_request:
    paths:
      - 'web/src/**'
      - 'api-service/realtime_voice.py'
      - 'api-service/main.py'
      - 'api-service/test_realtime_voice.py'
      - 'api-service/verify_persistence_http_e2e.py'
      - 'api-service/release_safety.py'
      - 'api-service/test_release_safety.py'
      - '.github/workflows/voice-workflow-capture.yml'

permissions:
  contents: read

jobs:
  evidence-and-safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check module syntax
        run: node --check web/src/workflowCapture.mjs
      - name: Run maintenance evidence regression tests
        run: node --test web/src/workflowCapture.test.mjs

  authenticated-voice-security:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install isolated test dependencies
        run: python -m pip install --disable-pip-version-check 'fastapi==0.115.8' 'httpx==0.28.1'
      - name: Compile voice service modules
        run: python -m py_compile api-service/realtime_voice.py api-service/test_realtime_voice.py api-service/release_safety.py api-service/test_release_safety.py
      - name: Run mocked security and quota tests
        run: python -m unittest discover -s api-service -p 'test_*.py' -v

  authenticated-persistence-real-mongo:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WR_QA_ALLOW_LOCAL_MONGO: "1"
      MONGO_URL: mongodb://127.0.0.1:27017
      DB_NAME: wrenchrelay_ci_persistence_isolated
      VERCEL_ENV: ""
      OPENAI_API_KEY: ""
      STRIPE_SECRET_KEY: ""
      STRIPE_SECRET_KEY_LIVE: ""
      GOOGLE_CLIENT_ID: ""
      WRENCHRELAY_REALTIME_ENABLED: "false"
      WRENCHRELAY_REALTIME_BUDGET_APPROVED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact API requirements
        run: python -m pip install --disable-pip-version-check -r api-service/requirements.txt
      - name: Real HTTP authentication, tenant isolation and database restart proof
        run: python api-service/verify_persistence_http_e2e.py
