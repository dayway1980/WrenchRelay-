name: Stripe Billing Regression

on:
  pull_request:
    paths:
      - 'server.py'
      - 'api-service/main.py'
      - 'backend/production.py'
      - 'tests/test_stripe_billing.py'
      - '.github/workflows/stripe-billing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stripe-offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install exact runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile billing entrypoints
        run: python -m py_compile server.py api-service/main.py backend/production.py tests/test_stripe_billing.py
      - name: Run synthetic Stripe contract tests (no keys/no charges)
        run: python -m unittest discover -s tests -p test_stripe_billing.py -v
