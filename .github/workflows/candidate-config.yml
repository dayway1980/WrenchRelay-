name: Candidate API configuration checks
on:
  pull_request:
    paths:
      - 'server.py'
      - 'api-service/main.py'
      - 'tests/test_candidate_config.py'
      - '.github/workflows/candidate-config.yml'
  push:
    branches: [main]
    paths:
      - 'server.py'
      - 'api-service/main.py'
      - 'tests/test_candidate_config.py'
      - '.github/workflows/candidate-config.yml'
permissions:
  contents: read
jobs:
  verify-defaults:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Check candidate defaults without dependencies or credentials
        run: python -m unittest discover -s tests -p 'test_candidate_config.py' -v
      - name: Check entrypoint syntax
        run: python -m py_compile server.py api-service/main.py
