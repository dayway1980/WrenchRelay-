name: Source commissioning

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'server.py'
      - 'api-service/**'
      - '.env.example'
      - 'commission.py'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/source-commissioning.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'server.py'
      - 'api-service/**'
      - '.env.example'
      - 'commission.py'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/source-commissioning.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify Python syntax
        run: python -m compileall -q backend api-service server.py commission.py scripts/container_smoke.py
      - name: Run dependency-free commissioning gates
        run: python commission.py
      - name: Rehearse SQLite backup safety on temporary fixtures
        run: python -m unittest discover -s tests -p test_sqlite_backup_rehearsal.py
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Verify health and legal configuration behavior
        run: python -m pytest -q tests/test_health_contract.py tests/test_legal_defaults.py
