name: Dispatch core
on:
  pull_request:
    paths:
      - 'services/dispatch-core/**'
      - '.github/workflows/dispatch-core.yml'
  push:
    branches: [main, 'feat/dispatch-core-launch-20261026']
    paths:
      - 'services/dispatch-core/**'
      - '.github/workflows/dispatch-core.yml'
permissions:
  contents: read
concurrency:
  group: dispatch-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/dispatch-core
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.22.1
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Strict TypeScript compilation
        run: npm run build
      - name: Dispatch constraints and provider contracts
        run: npm test
