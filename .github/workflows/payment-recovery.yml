name: Payment recovery
on:
  pull_request:
    paths:
      - 'services/payment-recovery/**'
      - '.github/workflows/payment-recovery.yml'
  push:
    branches: [main, 'fix/payment-recovery-20261027']
    paths:
      - 'services/payment-recovery/**'
      - '.github/workflows/payment-recovery.yml'
permissions:
  contents: read
jobs:
  payment-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        framework: [legacy, pinned, modern]
    defaults:
      run:
        working-directory: services/payment-recovery
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.11'
      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-tests.txt
      - name: Select legacy FastAPI/Starlette
        if: matrix.framework == 'legacy'
        run: python -m pip install --disable-pip-version-check --upgrade "fastapi==0.115.0" "starlette==0.38.6"
      - name: Select modern FastAPI/Starlette
        if: matrix.framework == 'modern'
        run: python -m pip install --disable-pip-version-check --upgrade "fastapi==0.162.0" "starlette==1.10.0"
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Compile Python integration and recovery code
        run: python -m compileall -q recovery.py integration.py bootstrap.py
      - name: Verify real SQLite transactions and synthetic Stripe boundaries
        run: python -m unittest discover -s tests -v
