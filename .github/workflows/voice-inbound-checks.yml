name: Rivit inbound voice checks

on:
  pull_request:
    paths:
      - 'api-service/twilio_voice.py'
      - 'api-service/rivit_media_bridge.py'
      - 'api-service/test_twilio_voice.py'
      - 'api-service/test_rivit_media_bridge.py'
      - 'api-service/verify_voice_inbound_http_e2e.py'
      - 'api-service/main.py'
      - 'api-service/requirements.txt'
      - '.github/workflows/voice-inbound-checks.yml'

permissions:
  contents: read

jobs:
  voice-inbound:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok' | grep 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      WR_QA_ALLOW_LOCAL_MONGO: "1"
      WR_QA_MONGO_URL: mongodb://127.0.0.1:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact API requirements
        run: python -m pip install --disable-pip-version-check -r api-service/requirements.txt
      - name: Offline gateway and media bridge tests (no network, no audio, no Twilio)
        run: python -m unittest discover -s api-service -p 'test_*.py' -v
      - name: Simulated inbound call over HTTP, replay, tenant isolation and restart persistence
        run: WR_QA_ALLOW_LOCAL_MONGO=1 python api-service/verify_voice_inbound_http_e2e.py
