name: Gateway production routing regression

on:
  pull_request:
    paths:
      - 'runtime/gateway/**'
      - '.github/workflows/gateway-release.yml'
  push:
    branches: [main]
    paths:
      - 'runtime/gateway/**'
      - '.github/workflows/gateway-release.yml'

permissions:
  contents: read

jobs:
  gateway-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Fetch checksum-pinned Caddy for isolated routing tests
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            --connect-timeout 15 --max-time 120 \
            'https://github.com/caddyserver/caddy/releases/download/v2.11.7/caddy_2.11.7_linux_amd64.tar.gz' \
            --output "$RUNNER_TEMP/caddy.tar.gz"
          printf '%s  %s\n' \
            '727b91701a392de6ebc5027509f548bf39979e5216340d0faed8fa5e69c84f8b' \
            "$RUNNER_TEMP/caddy.tar.gz" | sha256sum --check
          tar --no-same-owner -xzf "$RUNNER_TEMP/caddy.tar.gz" -C "$RUNNER_TEMP" caddy
      - name: Validate full gateway startup and routing without production data
        shell: bash
        run: |
          set -euo pipefail
          sh -n runtime/gateway/start-command.sh
          python3 runtime/gateway/test_release.py \
            --command runtime/gateway/start-command.sh --caddy "$RUNNER_TEMP/caddy"
